<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Felicidades Belén 🎉</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: linear-gradient(180deg, #ffb6d9, #ffdff0, #fff6fb);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      text-align: center;
      padding: 20px;
    }

    .card {
      width: min(92vw, 760px);
      background: rgba(255, 255, 255, 0.32);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 30px;
      padding: 30px 22px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
      position: relative;
      z-index: 20;
    }

    h1 {
      font-size: clamp(30px, 7vw, 58px);
      color: #d81b60;
      margin-bottom: 10px;
      text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.7);
    }

    h2 {
      font-size: clamp(22px, 5vw, 38px);
      color: #8e24aa;
      margin-bottom: 14px;
    }

    p {
      font-size: clamp(17px, 4vw, 24px);
      color: #5c2952;
      line-height: 1.4;
      margin-bottom: 18px;
    }

    button {
      border: none;
      background: linear-gradient(90deg, #ff4fa3, #ff7e5f);
      color: white;
      font-size: 20px;
      font-weight: bold;
      padding: 15px 26px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s ease;
      margin-top: 8px;
    }

    button:hover {
      transform: scale(1.05);
    }

    .hidden {
      display: none;
    }

    .celebration {
      margin-top: 20px;
      animation: aparecer 1s ease;
    }

    .main-message {
      font-size: clamp(24px, 5vw, 40px);
      font-weight: bold;
      color: #c2185b;
      margin-bottom: 14px;
      line-height: 1.35;
    }

    .foto-belen {
      width: min(72vw, 260px);
      height: 260px;
      object-fit: cover;
      object-position: center;
      border-radius: 28px;
      border: 5px solid white;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.25);
      margin: 15px auto 20px;
      display: block;
      animation: flotarFoto 1.8s infinite alternate ease-in-out;
    }

    .sub-message {
      font-size: clamp(18px, 4vw, 28px);
      color: #6a1b9a;
      margin-bottom: 22px;
      font-weight: bold;
    }

    .cats {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .cat {
      font-size: clamp(42px, 9vw, 74px);
      animation: bailar 0.7s infinite alternate ease-in-out;
      display: inline-block;
    }

    .cat:nth-child(2) {
      animation-delay: 0.15s;
    }

    .cat:nth-child(3) {
      animation-delay: 0.3s;
    }

    .cat:nth-child(4) {
      animation-delay: 0.45s;
    }

    .cat:nth-child(5) {
      animation-delay: 0.6s;
    }

    .balloon {
      position: absolute;
      bottom: -140px;
      width: 65px;
      height: 85px;
      border-radius: 50%;
      z-index: 4;
      animation: subirGlobo linear forwards;
    }

    .balloon::before {
      content: "";
      position: absolute;
      bottom: -30px;
      left: 50%;
      width: 2px;
      height: 35px;
      background: rgba(80, 80, 80, 0.65);
      transform: translateX(-50%);
    }

    .balloon::after {
      content: "";
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 12px solid rgba(255, 255, 255, 0.45);
    }

    .heart {
      position: absolute;
      top: -30px;
      font-size: 26px;
      animation: caer 5s linear forwards;
      pointer-events: none;
      z-index: 3;
    }

    .confetti {
      position: absolute;
      top: -20px;
      width: 10px;
      height: 16px;
      opacity: 0.9;
      animation: caer 4.5s linear forwards;
      pointer-events: none;
      z-index: 3;
    }

    @keyframes bailar {
      from {
        transform: translateY(0) rotate(-8deg) scale(1);
      }

      to {
        transform: translateY(-14px) rotate(8deg) scale(1.08);
      }
    }

    @keyframes flotarFoto {
      from {
        transform: translateY(0) scale(1);
      }

      to {
        transform: translateY(-8px) scale(1.03);
      }
    }

    @keyframes subirGlobo {
      0% {
        transform: translateY(0);
        opacity: 0.95;
      }

      100% {
        transform: translateY(-125vh);
        opacity: 0;
      }
    }

    @keyframes caer {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
      }
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: scale(0.85);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <div id="intro">
      <h1>🎉 Sorpresa 🎉</h1>
      <h2>Para Belén</h2>
      <p>Presioná el botón para ver tu felicitación especial.</p>
      <button onclick="iniciarSorpresa()">Ver sorpresa</button>
    </div>

    <div id="celebration" class="celebration hidden">
      <div class="main-message">
        ¡Felicidades Belén por aprobar tu parcial! 🎓🎉
      </div>

      <img class="foto-belen" src="belen.png" alt="Foto especial de Belén">

      <div class="sub-message">
        Estoy muy orgulloso de vos 💖
      </div>

      <div class="cats">
        <span class="cat">🐱</span>
        <span class="cat">😸</span>
        <span class="cat">🐱</span>
        <span class="cat">😺</span>
        <span class="cat">🐈</span>
      </div>
    </div>
  </div>

  <script>
    let musicaIniciada = false;
    let animacionesIniciadas = false;

    function iniciarSorpresa() {
      document.getElementById('intro').classList.add('hidden');
      document.getElementById('celebration').classList.remove('hidden');

      if (!animacionesIniciadas) {
        animacionesIniciadas = true;
        lanzarConfeti();
        lanzarCorazones();
        lanzarGlobos();
        iniciarMusicaAlegre();
      }
    }

    function lanzarConfeti() {
      crearExplosionConfeti(130);
      setInterval(() => crearExplosionConfeti(25), 1700);
    }

    function crearExplosionConfeti(cantidad) {
      const colores = [
        '#ff4fa3',
        '#ff9800',
        '#ffd54f',
        '#7c4dff',
        '#26c6da',
        '#66bb6a'
      ];

      for (let i = 0; i < cantidad; i++) {
        const confetti = document.createElement('div');
        confetti.classList.add('confetti');

        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.background = colores[Math.floor(Math.random() * colores.length)];
        confetti.style.animationDuration = (3 + Math.random() * 3) + 's';
        confetti.style.transform = `rotate(${Math.random() * 360}deg)`;

        document.body.appendChild(confetti);

        setTimeout(() => {
          confetti.remove();
        }, 7000);
      }
    }

    function lanzarCorazones() {
      setInterval(() => {
        for (let i = 0; i < 6; i++) {
          const heart = document.createElement('div');
          heart.classList.add('heart');

          heart.innerHTML = Math.random() > 0.5 ? '💖' : '💗';
          heart.style.left = Math.random() * 100 + 'vw';
          heart.style.fontSize = (18 + Math.random() * 18) + 'px';
          heart.style.animationDuration = (3 + Math.random() * 3) + 's';

          document.body.appendChild(heart);

          setTimeout(() => {
            heart.remove();
          }, 7000);
        }
      }, 1200);
    }

    function lanzarGlobos() {
      const colores = [
        'linear-gradient(180deg, #ff5fa2, #ff2d7a)',
        'linear-gradient(180deg, #7c4dff, #5e35b1)',
        'linear-gradient(180deg, #ffb300, #ff8f00)',
        'linear-gradient(180deg, #26c6da, #00acc1)',
        'linear-gradient(180deg, #66bb6a, #43a047)'
      ];

      setInterval(() => {
        const balloon = document.createElement('div');
        balloon.classList.add('balloon');

        balloon.style.left = Math.random() * 92 + 'vw';
        balloon.style.background = colores[Math.floor(Math.random() * colores.length)];
        balloon.style.animationDuration = (7 + Math.random() * 4) + 's';

        document.body.appendChild(balloon);

        setTimeout(() => {
          balloon.remove();
        }, 13000);
      }, 900);
    }

    function iniciarMusicaAlegre() {
      if (musicaIniciada) return;

      musicaIniciada = true;

      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AudioContext();

      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const master = audioCtx.createGain();
      master.gain.value = 0.10;
      master.connect(audioCtx.destination);

      const melodia = [
        { f: 523.25, t: 0.00 },
        { f: 659.25, t: 0.25 },
        { f: 783.99, t: 0.50 },
        { f: 659.25, t: 0.75 },
        { f: 698.46, t: 1.00 },
        { f: 783.99, t: 1.25 },
        { f: 880.00, t: 1.50 },
        { f: 783.99, t: 1.75 },
        { f: 659.25, t: 2.00 },
        { f: 523.25, t: 2.25 },
        { f: 659.25, t: 2.50 },
        { f: 783.99, t: 2.75 }
      ];

      function tocarMelodia() {
        const ahora = audioCtx.currentTime;

        melodia.forEach((nota) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(nota.f, ahora + nota.t);

          gain.gain.setValueAtTime(0.0001, ahora + nota.t);
          gain.gain.exponentialRampToValueAtTime(0.25, ahora + nota.t + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0001, ahora + nota.t + 0.22);

          osc.connect(gain);
          gain.connect(master);

          osc.start(ahora + nota.t);
          osc.stop(ahora + nota.t + 0.24);
        });
      }

      tocarMelodia();
      setInterval(tocarMelodia, 3200);
    }
  </script>

</body>
</html>
